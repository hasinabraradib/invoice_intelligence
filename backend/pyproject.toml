[project]
name = "invoice-intelligence"
version = "0.1.0"
description = "AI-powered document intelligence for invoices (backend)"
requires-python = ">=3.12,<3.13"
# Runtime dependencies. Lower bounds only; the Docker image is the reproducible build.
dependencies = [
    "fastapi>=0.115",            # web framework (async, OpenAPI docs for free)
    "uvicorn[standard]>=0.30",   # ASGI server that runs FastAPI
    "pydantic-settings>=2.4",    # typed settings loaded from environment variables
    "sqlalchemy[asyncio]>=2.0.30", # ORM / query builder, async flavour
    "asyncpg>=0.29",             # fast async PostgreSQL driver used by SQLAlchemy
    "alembic>=1.13",             # database migrations
    "redis>=5.0",                # Redis client (includes redis.asyncio)
    "python-multipart>=0.0.9",   # lets FastAPI parse multipart/form-data file uploads
    "pypdfium2>=4.30",           # PDFium (Chrome's PDF engine): robust open, page count, encryption
    "pdfplumber>=0.11",          # per-page text extraction from the PDF text layer
    "pandas>=2.2",               # reads every sheet of xlsx/xls workbooks
    "openpyxl>=3.1",             # pandas engine for .xlsx
    "xlrd>=2.0",                 # pandas engine for legacy .xls (2.x reads ONLY .xls, by design)
    "charset-normalizer>=3.3",   # guesses the text encoding of CSV files
    "pillow>=10.4",              # opens images to count frames (multi-page TIFF)
    "opencv-python-headless>=4.10",  # image cleanup before OCR ("headless" = no GUI libs)
    "numpy>=2.0",                # pixel arrays shared by OpenCV, Pillow and pdfium
    "pytesseract>=0.3.13",       # thin wrapper that runs the tesseract binary
    "httpx>=0.27",               # HTTP client for the LLM providers' REST APIs
]

[project.optional-dependencies]
# Tools needed only for development / CI, not in production.
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
    "reportlab>=4.2",  # generates PDF fixtures in tests (no binary fixtures committed)
    "xlwt>=1.3",       # writes legacy .xls fixtures in tests (unmaintained, test-only)
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

# Only `app` is our importable package; `alembic/` and `tests/` are not part of it.
[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not slow'"
markers = ["slow: long-running tests (run with: pytest -m slow)"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# E/F = pycodestyle + pyflakes basics, I = import sorting, B = bugbear (likely bugs),
# UP = modern syntax, S = bandit security checks, ASYNC = async pitfalls, SIM = simplifications.
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "SIM"]

[tool.ruff.lint.per-file-ignores]
# `assert` is how pytest works, so the "no assert" security rule does not apply to tests.
"tests/**" = ["S101"]
