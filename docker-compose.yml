# Local development stack. Start with `make up`, stop with `make down`.
# All config comes from .env (copied from .env.example by `make up` if missing).

# Shared settings for api + worker (YAML anchor, merged in below with <<).
x-backend: &backend
  build:
    context: ./backend
    args:
      INSTALL_DEV: "true"   # include pytest/ruff so `make test`/`make lint` run in the container
  image: invoice-intelligence-backend:dev
  env_file: .env
  volumes:
    - uploads:/data/uploads
    - models:/models   # embedding model cache (downloaded once)
  depends_on:
    postgres:
      condition: service_healthy   # wait until pg_isready succeeds, not just "container started"
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  api:
    <<: *backend
    # Apply DB migrations, then start the web server. (No migrations exist yet: a no-op.)
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "127.0.0.1:8000:8000"   # bind to localhost only, not to every network interface
    healthcheck:
      # The slim image has no curl, so use Python's standard library to call /health.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    <<: *backend
    # arq worker: picks queued jobs from Redis and runs the processing pipeline.
    command: arq app.worker.WorkerSettings
    # A tiny init as PID 1 reaps killed step processes (parse/OCR/embedding pools).
    init: true
    stop_grace_period: 30s
    # Liveness: the worker's event loop touches this file every 5 s. If the loop blocks,
    # the worker exits by itself (WORKER_LOOP_STALL_SECONDS) and `restart` brings it back;
    # the healthcheck shows the state in `docker compose ps`.
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys, time; sys.exit(0 if time.time() - os.path.getmtime('/tmp/worker-alive') < 90 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      args:
        # The BROWSER calls the API, so this is the API address as seen from your machine.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
    restart: unless-stopped

  postgres:
    # Official Postgres + the pgvector extension (needed later for semantic search).
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data   # data survives `docker compose down`
    healthcheck:
      # $$ escapes $ so the variable is expanded inside the container, not by compose.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    # No `ports:` on purpose: only other containers need the database.

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
  models:
